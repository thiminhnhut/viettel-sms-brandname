[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viettel-sms-brandname"
version = "1.0.0"
description = "Thư viện Python tích hợp chính thức Viettel SMS Brandname v2 API với cơ chế tự động quản lý Token và Template."
readme = "README.md"
authors = [
    { name = "thiminhnhut", email = "thiminhnhut@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.7"
dependencies = [
    "requests>=2.25.0"
]

[project.urls]
Homepage = "https://github.com/thiminhnhut/viettel-sms-brandname"