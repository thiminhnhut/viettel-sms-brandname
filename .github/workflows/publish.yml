# Tự publish lên PyPI khi push tag dạng v1.2.3.
# Cần cấu hình Trusted Publisher trên PyPI trước:
#   PyPI > Your projects > viettel-sms-brandname > Publishing > Add a new publisher
#   Owner: thiminhnhut, Repository: viettel-sms-brandname,
#   Workflow: publish.yml, Environment: pypi
name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Kiểm tra tag khớp với __version__
        run: |
          VERSION=$(python -c "import viettel_sms; print(viettel_sms.__version__)")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME không khớp với __version__ = $VERSION"
            exit 1
          fi
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
